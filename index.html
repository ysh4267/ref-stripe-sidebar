<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stripe 대시보드의 사이드바 접기 손잡이를 레퍼런스 영상 그대로 다시 그린 페이지">
  <title>Sidebar Toggle</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <!-- 좌표는 레퍼런스 영상(1920x1080) 픽셀 그대로다. 화면을 덮도록 왼쪽 위 기준으로 맞춘다. -->
  <svg id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="xMinYMin slice" aria-label="사이드바와 대시보드">
    <g id="nav-open"></g>
    <g id="nav-shut" hidden></g>
    <rect id="edge" y="-20" width="4" height="1200"></rect>
    <g id="handle">
      <polyline id="bar" points=""></polyline>
      <rect id="hit" y="480" width="110" height="140" role="button" tabindex="0" aria-label="Collapse"></rect>
    </g>
    <g id="tip" aria-hidden="true">
      <rect id="tip-box" y="505" height="89" rx="18"></rect>
      <text id="tip-text"></text>
    </g>
  </svg>
</body>
</html>
